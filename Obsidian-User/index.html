<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kavin | Obsidian-User</title>
  <meta name="description" content="kavin 的 Obsidian-User 入口页" />
  <style>
    :root {
      --page-bg: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.82);
      --panel-border: rgba(148, 163, 184, 0.12);
      --text-main: #f8fafc;
      --text-sub: rgba(226, 232, 240, 0.72);
      --text-soft: rgba(226, 232, 240, 0.5);
      --button-bg: rgba(15, 23, 42, 0.24);
      --button-border: rgba(148, 163, 184, 0.16);
      --button-hover: rgba(51, 65, 85, 0.72);
      --icon-bg: linear-gradient(145deg, #f8fafc, #dbe4f3);
      --icon-text: #7c3aed;
      --card-shadow: 0 20px 60px rgba(2, 6, 23, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.08), transparent 30%),
        linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
      color: var(--text-main);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: 56px 24px 80px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      padding-top: 8px;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #f8fafc, #d6dbe4);
      color: #ffffff;
      font-size: 36px;
      font-weight: 800;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.26);
    }

    .title {
      margin: 0;
      font-size: clamp(34px, 8vw, 56px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      margin-top: 6px;
    }

    .ghost-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 148px;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      color: var(--text-sub);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      backdrop-filter: blur(10px);
    }

    .ghost-button:hover {
      transform: translateY(-1px);
      background: var(--button-hover);
      border-color: rgba(148, 163, 184, 0.3);
    }

    .section {
      margin-top: 72px;
    }

    .section-label {
      margin: 0 0 18px;
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .project-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px 24px;
      border-radius: 22px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--card-shadow);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      backdrop-filter: blur(12px);
    }

    .project-card:hover {
      transform: translateY(-2px);
      border-color: rgba(148, 163, 184, 0.26);
      background: rgba(30, 41, 59, 0.9);
    }

    .project-icon {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #ede9fe, #ddd6fe);
      color: var(--icon-text);
      font-size: 22px;
      font-weight: 800;
    }

    .project-body {
      min-width: 0;
      flex: 1 1 auto;
    }

    .project-name {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .project-desc {
      margin: 0;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.7;
    }

    .project-arrow {
      flex: 0 0 auto;
      color: rgba(226, 232, 240, 0.6);
      font-size: 26px;
      line-height: 1;
    }

    @media (max-width: 640px) {
      .page {
        padding: 40px 18px 56px;
      }

      .section {
        margin-top: 54px;
      }

      .project-card {
        align-items: flex-start;
        padding: 18px;
      }

      .project-name {
        font-size: 20px;
      }

      .project-desc {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="avatar">K</div>
      <h1 class="title">kavin</h1>
      <p class="subtitle">Obsidian 工作流记录者，围绕笔记管理持续打磨主页、卡片与信息组织体验。</p>
      <div class="hero-actions">
        <a class="ghost-button" href="/2026/04/16/00index-Obsidian-User/" aria-label="打开 Obsidian User Markdown 页面">打开 Markdown 页</a>
      </div>
    </section>

    <section class="section">
      <p class="section-label">PAGE</p> 
      <div class="project-list">
        <a class="project-card" href="/Obsidian-User/datacore-HomePage/" aria-label="打开 HomePage 页面">
          <div class="project-icon">H</div>
          <div class="project-body">
            <h2 class="project-name">HomePage</h2>
            <p class="project-desc">点击进入 datacore-HomePage 介绍页，查看定位、功能结构与使用场景。</p>
          </div>
          <div class="project-arrow">→</div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
